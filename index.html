<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Işık İzi - 2 Kişilik</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 30%, #0b1226 0%, #05070f 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; font-family: 'Segoe UI', Arial, sans-serif; color:#e8ecf1;
    overflow:hidden;
  }
  h1 {
    letter-spacing: 4px; font-size: 26px; margin-bottom: 6px;
    color:#5cffe0; text-shadow: 0 0 16px rgba(92,255,224,0.6);
  }
  #hud {
    display:flex; justify-content:space-between; width:900px; margin-bottom:8px;
    font-size:14px;
  }
  .p1 { color:#5cd6ff; }
  .p2 { color:#ff5c8a; text-align:right; }
  #score { font-size:16px; font-weight:bold; }
  canvas {
    background:#070b16;
    border:2px solid #1c2740;
    border-radius: 10px;
    box-shadow: 0 0 50px rgba(92,255,224,0.08), inset 0 0 60px rgba(0,0,0,0.6);
  }
  #info {
    margin-top:10px; font-size:12px; color:#8a94a6; text-align:center; line-height:1.6;
  }
  #overlay { position:absolute; display:flex; flex-direction:column; align-items:center; }
  #msg {
    font-size:40px; font-weight:bold;
    text-shadow: 0 0 20px rgba(0,0,0,0.9); display:none;
    background: rgba(5,7,15,0.9); padding: 20px 40px; border-radius: 14px;
    border: 1px solid #1c2740;
  }
  #restart {
    margin-top:16px; padding:10px 22px; font-size:14px; cursor:pointer;
    background:#5cffe0; color:#05070f; border:none; border-radius:8px; font-weight:bold;
    display:none;
  }
  #restart:hover { background:#8dffe9; }
  #countdown {
    position:absolute; font-size:70px; font-weight:bold; color:#5cffe0;
    text-shadow: 0 0 30px rgba(92,255,224,0.7); display:none;
  }
</style>
</head>
<body>

<h1>💡 IŞIK İZİ DÜELLOSU 💡</h1>

<div id="hud">
  <div class="p1">OYUNCU 1 (Mavi)</div>
  <div id="score">0 — 0</div>
  <div class="p2">OYUNCU 2 (Pembe)</div>
</div>

<canvas id="game" width="900" height="560"></canvas>

<div id="overlay">
  <div id="countdown"></div>
  <div id="msg"></div>
  <button id="restart">Sonraki Tur</button>
</div>

<div id="info">
  Oyuncu 1: W A S D ile yön değiştir (Mavi)<br>
  Oyuncu 2: ← ↑ → ↓ ok tuşları ile yön değiştir (Pembe)<br>
  Kendi izine veya rakibin izine çarpma, önce çarpan kaybeder!
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const CELL = 6;
const COLS = W/CELL, ROWS = H/CELL;

// ===== SES MOTORU =====
const actx = new (window.AudioContext || window.webkitAudioContext)();
function unlockAudio(){
  if(actx.state === "suspended") actx.resume();
  window.removeEventListener('keydown', unlockAudio);
  window.removeEventListener('click', unlockAudio);
}
window.addEventListener('keydown', unlockAudio);
window.addEventListener('click', unlockAudio);

function playTone(freq, duration, type='square', volume=0.15, glideTo=null){
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, actx.currentTime);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, actx.currentTime + duration);
  gain.gain.setValueAtTime(volume, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  osc.connect(gain).connect(actx.destination);
  osc.start();
  osc.stop(actx.currentTime + duration);
}
function playNoise(duration, volume=0.2){
  const bufferSize = actx.sampleRate * duration;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const noise = actx.createBufferSource();
  noise.buffer = buffer;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(volume, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
  noise.connect(gain).connect(actx.destination);
  noise.start();
}
const sfx = {
  turn: () => playTone(500, 0.05, 'square', 0.05, 600),
  crash: () => { playNoise(0.3, 0.25); playTone(80, 0.25, 'sawtooth', 0.15, 30); },
  countdown: (f) => playTone(f, 0.15, 'square', 0.12),
  win: () => { [523,659,784,1046].forEach((f,i)=> setTimeout(()=>playTone(f,0.3,'square',0.15),i*130)); }
};

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

class Cycle {
  constructor(x,y,dir,color,controls){
    this.x=x; this.y=y; this.dir=dir; this.color=color; this.controls=controls;
    this.trail = new Set();
    this.trail.add(x+","+y);
    this.alive = true;
    this.moveTimer = 0;
    this.pendingDir = dir;
  }
  handleInput(){
    const c = this.controls;
    const opp = {up:'down',down:'up',left:'right',right:'left'};
    let want = null;
    if(keys[c.up]) want='up';
    else if(keys[c.down]) want='down';
    else if(keys[c.left]) want='left';
    else if(keys[c.right]) want='right';
    if(want && want !== opp[this.dir]){
      if(want !== this.pendingDir) sfx.turn();
      this.pendingDir = want;
    }
  }
  step(){
    if(!this.alive) return;
    this.dir = this.pendingDir;
    const [dx,dy] = DIRS[this.dir];
    this.x += dx; this.y += dy;
  }
  draw(){
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    for(const key of this.trail){
      const [tx,ty] = key.split(",").map(Number);
      ctx.fillRect(tx*CELL, ty*CELL, CELL-1, CELL-1);
    }
    // kafa (parlak)
    if(this.alive){
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(this.x*CELL, this.y*CELL, CELL-1, CELL-1);
    }
    ctx.shadowBlur = 0;
  }
}

let p1, p2, running=false, score1=0, score2=0, moveInterval=60; // ms per step
let lastStep = 0;

function newRound(){
  p1 = new Cycle(10, ROWS/2, 'right', "#5cd6ff", {up:"KeyW",down:"KeyS",left:"KeyA",right:"KeyD"});
  p2 = new Cycle(COLS-11, ROWS/2, 'left', "#ff5c8a", {up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"});
  document.getElementById('msg').style.display='none';
  document.getElementById('restart').style.display='none';
  document.getElementById('score').textContent = score1 + " — " + score2;
  runCountdown();
}

function runCountdown(){
  running = false;
  const cd = document.getElementById('countdown');
  cd.style.display = 'block';
  let n = 3;
  cd.textContent = n;
  sfx.countdown(440);
  const iv = setInterval(()=>{
    n--;
    if(n>0){ cd.textContent = n; sfx.countdown(440); }
    else if(n===0){ cd.textContent = "GİT!"; sfx.countdown(700); }
    else {
      clearInterval(iv);
      cd.style.display='none';
      running = true;
      lastStep = performance.now();
    }
  }, 650);
}

function checkCollision(cyc, other){
  if(cyc.x<0||cyc.x>=COLS||cyc.y<0||cyc.y>=ROWS) return true;
  const key = cyc.x+","+cyc.y;
  if(cyc.trail.has(key)) return true;
  if(other.trail.has(key)) return true;
  return false;
}

function endRound(winner, draw){
  running = false;
  const msg = document.getElementById('msg');
  if(draw){
    msg.style.color = "#ffcf5c";
    msg.textContent = "BERABERE!";
  } else {
    msg.style.color = winner===p1 ? "#5cd6ff" : "#ff5c8a";
    msg.textContent = (winner===p1 ? "OYUNCU 1" : "OYUNCU 2") + " KAZANDI!";
    if(winner===p1) score1++; else score2++;
  }
  document.getElementById('score').textContent = score1 + " — " + score2;
  msg.style.display = 'block';
  document.getElementById('restart').style.display = 'block';
  sfx.win();
}

document.getElementById('restart').addEventListener('click', newRound);

function drawGrid(){
  ctx.strokeStyle = "rgba(92,255,224,0.03)";
  for(let x=0;x<COLS;x++){ ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,H); ctx.stroke(); }
  for(let y=0;y<ROWS;y++){ ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(W,y*CELL); ctx.stroke(); }
}

function loop(ts){
  ctx.clearRect(0,0,W,H);
  drawGrid();

  if(running){
    p1.handleInput();
    p2.handleInput();

    if(ts - lastStep >= moveInterval){
      lastStep = ts;
      p1.step();
      p2.step();

      const p1crash = checkCollision(p1, p2);
      const p2crash = checkCollision(p2, p1);

      if(p1crash || p2crash) sfx.crash();

      if(p1crash) p1.alive = false;
      if(p2crash) p2.alive = false;

      if(!p1crash) p1.trail.add(p1.x+","+p1.y);
      if(!p2crash) p2.trail.add(p2.x+","+p2.y);

      if(p1crash && p2crash) endRound(null, true);
      else if(p1crash) endRound(p2, false);
      else if(p2crash) endRound(p1, false);
    }
  }

  p1.draw();
  p2.draw();

  requestAnimationFrame(loop);
}

newRound();
requestAnimationFrame(loop);
</script>
</body>
</html>
